# FiveM-Coccion Server Configuration

# Database configuration
set mysql_connection_string "server=localhost;database=fivem_coccion;userid=root;password=your_password"

# Enable debug mode
set coccion_debug "false"

# Set default framework
set coccion_framework "esx"

# Cooking settings
set coccion_cooking_time "5000"
set coccion_min_level "1"
set coccion_max_level "100"

# Logging
ensure coccion_logger